<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enciclopedia de Carismas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Geist:wght@300..700&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script>try{var t=localStorage.getItem('tema');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6"><line x1="16" y1="2" x2="16" y2="10.5"/><line x1="16" y1="21.5" x2="16" y2="30"/><line x1="2" y1="16" x2="10.5" y2="16"/><line x1="21.5" y1="16" x2="30" y2="16"/><line x1="6.1" y1="6.1" x2="12.1" y2="12.1"/><line x1="19.9" y1="19.9" x2="25.9" y2="25.9"/><line x1="25.9" y1="6.1" x2="19.9" y2="12.1"/><line x1="12.1" y1="19.9" x2="6.1" y2="25.9"/></g></svg>
      Carismas
    </a>
    <nav aria-label="Secciones">
      <a href="#familias">Familias</a>
      <a href="#indice">Fichas</a>
      <a href="#glosario">Glosario</a>
      <a href="#sugerir">Sugerir</a>
    </nav>
    <button type="button" id="temaBtn" class="theme-btn" aria-label="Cambiar a tema oscuro" aria-pressed="false">
      <svg class="ic-sol" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path d="M10 1.5v2.4M10 16.1v2.4M18.5 10h-2.4M3.9 10H1.5M15.9 4.1l-1.7 1.7M5.8 14.2l-1.7 1.7M15.9 15.9l-1.7-1.7M5.8 5.8 4.1 4.1"/></svg>
      <svg class="ic-luna" viewBox="0 0 20 20" aria-hidden="true"><path d="M17 12.4A7 7 0 0 1 7.6 3 7 7 0 1 0 17 12.4Z"/></svg>
    </button>
  </div>
</header>

<main id="app" class="wrap"></main>

<div class="tip" id="tip" hidden>
  <div class="card" role="dialog" aria-labelledby="tipT">
    <b id="tipT"></b><button type="button" id="tipX">Cerrar</button>
    <p id="tipD"></p>
    <a href="#glosario" id="tipL">Ver todo el glosario</a>
  </div>
</div>

<button type="button" id="arriba" class="to-top" aria-label="Volver arriba">
  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5V4.5M4.5 10 10 4.5 15.5 10"/></svg>
</button>

<script src="js/datos/marcas.js"></script>
<script src="js/datos/glosario.js"></script>
<script src="js/datos/familias.js"></script>
<script src="js/datos/fichas/_base.js"></script>
<script src="js/datos/fichas/monacal.js"></script>
<script src="js/datos/fichas/mendicante.js"></script>
<script src="js/datos/fichas/canonigos.js"></script>
<script src="js/datos/fichas/clerigos.js"></script>
<script src="js/datos/fichas/apostolica.js"></script>
<script src="js/datos/fichas/seculares.js"></script>
<script src="js/datos/fichas/movimientos.js"></script>
<script src="js/datos/fichas/diocesana.js"></script>
<script src="js/app.js"></script>
</body>
</html>
